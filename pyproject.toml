[project]
name = "docforge"
version = "0.1.0"
description = "DocForge: turns product changes into reviewed, evidence-backed documentation pull requests."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9,<3",
    "pyyaml>=6.0,<7",
]

[project.scripts]
docforge = "docforge.cli:main"

[project.optional-dependencies]
api = [
    "anthropic>=1,<2",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/docforge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
