# Example DocForge configuration. Copy to docforge.yaml and edit.
# Replace the example org and repo names with your own.

doc_collections:
  example-org/docs:
    docs_framework: docusaurus      # set once the migration target is chosen
    default_branch: main
    filter:
      - docs/                       # the agent may only change files under docs/
    api_url: https://api.github.com # used only by `publish open` and `publish ready --apply`
    token_env: GITHUB_TOKEN         # name of the environment variable, never the token
    checkout: ../docs               # local clone used to commit revisions
    bot_login: example-docforge-bot # DocForge's GitHub account: mentions start revisions
    plan_path: plans/{slug}/ia-plan.md  # where plan pull requests put ia-plan.md
    max_revisions: 5                # automatic revisions per pull request
    revision_delay_seconds: 120     # wait this long after the last review comment

context_sources:                    # read-only; fetched with `docforge sources fetch`
  product-jira:
    source_type: jira
    base_url: https://example.atlassian.net
    user_env: JIRA_USER_EMAIL       # names of environment variables, never the values
    auth_token_env: JIRA_API_TOKEN
    project_keys: [EXAMPLE]         # issues in other projects are refused
  product-wiki:
    source_type: confluence
    base_url: https://example.atlassian.net/wiki
    user_env: JIRA_USER_EMAIL
    auth_token_env: JIRA_API_TOKEN
    space_keys: [EXAMPLE]           # pages in other spaces are refused

packs:                              # house style; keep real packs in a private repository
  house:
    path: ../my-docs-pack           # folder with pack.yaml, relative to this file

backend:                            # optional: run stages through the Anthropic API (costs money)
  model: claude-opus-5-5
  effort: high
  api_key_env: ANTHROPIC_API_KEY    # name of the environment variable, never the key
  max_cost_usd: 5                   # a run stops before a call that could exceed this
  stages:
    proofreader:
      effort: high                  # per-stage overrides: model, effort, max_tokens

triggers:
  product-prs:
    trigger_type: github_pr
    own_pr:                         # PRs DocForge opened itself never trigger work
      branch_prefix: docforge/
      bot_logins: []
    match:
      - repos: [example-org/product-web]
        trigger_on: [opened, merge]
        trigger_directories: [src/]

  docs-tickets:                     # a Jira board as the front door (see README)
    trigger_type: jira_ticket
    source: product-jira
    statuses:                       # DocForge reacts only to plan and draft
      plan: In Draft
      draft: For review
      bounce: To Do
      planned: Peer review
      shipped: [Released]           # the docs pull request may then leave draft
    work_types:
      net_new: [Docs New]
      enhancement: [Docs Update]
    bot_account_env: DOCFORGE_JIRA_BOT_ACCOUNT
    webhook_secret_env: DOCFORGE_JIRA_WEBHOOK_SECRET
    pack: house
    product:
      labels: {}
      default: null
    workspace: ../docs-work           # each ticket's sources and run: <workspace>/tickets/<KEY>/
    audience: workspace admins
    publish:                          # after drafting, prepare a docs pull request
      collection: example-org/docs
      checkout: ../docs               # local clone of the docs repo
      base: main
      plan_pr: true                   # propose the plan as ia-plan.md in a pull request; approving it approves the plan

code_repos:                         # the dependency map: which code feeds which docs, and who owns it
  example-org/product-web:
    doc_collection: example-org/docs
    spec_paths: ["specs/**/spec.md"]
    checkout: ../product-web        # local clone: spec files and diffs are read from it
    workspace: ../docs-work/code    # features started from this repository's pull requests
    pack: house
    audience: workspace admins
    areas:
      - {path: "", products: [core], owner: example-writer}
      - {path: src/analytics/, products: [analytics], feature: Dashboards, owner: example-writer-2,
         spec: specs/dashboards/spec.md}
      - {path: tools/, products: [internal], documented: false}

triage:                             # "docs needed?" for code pull requests
  model: null                       # set a model to judge product code; without one, a person confirms
  max_cost_usd_per_pr: 0.10
  max_cost_usd_per_day: 5.0

policies:
  default:
    publishing:
      auto_create_pr: false         # true: DocForge pushes and opens draft PRs itself, and marks them ready when shipped
      auto_merge: false
      jira_comments: false          # off: replies go to the ticket's outbox only
      jira_transitions: false
      source_pr_feedback: false     # true: advisory status (never blocking) and comment on code PRs
    notification:
      slack_channel: null           # set with slack_webhook_env to allow `notify slack --send`
    archiving:
      stale_after_days: 30
  rules:
    - if:
        trigger: product-prs
      then:
        publishing:
          auto_create_pr: true
