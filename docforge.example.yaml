# Example DocForge configuration. Copy to docforge.yaml and edit.
# Replace the example org and repo names with your own.

doc_collections:
  example-org/docs:
    docs_framework: docusaurus      # set once the migration target is chosen
    default_branch: main
    filter:
      - docs/                       # the agent may only change files under docs/

context_sources:                    # read-only; fetched with `docforge sources fetch`
  product-jira:
    source_type: jira
    base_url: https://example.atlassian.net
    user_env: JIRA_USER_EMAIL       # names of environment variables, never the values
    auth_token_env: JIRA_API_TOKEN
    project_keys: [EXAMPLE]         # issues in other projects are refused
  product-wiki:
    source_type: confluence
    base_url: https://example.atlassian.net/wiki
    user_env: JIRA_USER_EMAIL
    auth_token_env: JIRA_API_TOKEN
    space_keys: [EXAMPLE]           # pages in other spaces are refused

packs:                              # house style; keep real packs in a private repository
  house:
    path: ../my-docs-pack           # folder with pack.yaml, relative to this file

backend:                            # optional: run stages through the Anthropic API (costs money)
  model: claude-opus-5-5
  effort: high
  api_key_env: ANTHROPIC_API_KEY    # name of the environment variable, never the key
  max_cost_usd: 5                   # a run stops before a call that could exceed this
  stages:
    proofreader:
      effort: high                  # per-stage overrides: model, effort, max_tokens

triggers:
  product-prs:
    trigger_type: github_pr
    own_pr:                         # PRs DocForge opened itself never trigger work
      branch_prefix: docforge/
      bot_logins: []
    match:
      - repos: [example-org/product-web]
        trigger_on: [opened, merge]
        trigger_directories: [src/]

  docs-tickets:                     # a Jira board as the front door (see README)
    trigger_type: jira_ticket
    source: product-jira
    statuses:                       # DocForge reacts only to plan and draft
      plan: In Draft
      draft: For review
      bounce: To Do
      planned: Peer review
    work_types:
      net_new: [Docs New]
      enhancement: [Docs Update]
    bot_account_env: DOCFORGE_JIRA_BOT_ACCOUNT
    webhook_secret_env: DOCFORGE_JIRA_WEBHOOK_SECRET
    pack: house
    product:
      labels: {}
      default: null
    workspace: ../docs-work           # each ticket's sources and run: <workspace>/tickets/<KEY>/
    audience: workspace admins

policies:
  default:
    publishing:
      auto_create_pr: false         # drafts wait for review in the app
      auto_merge: false
      jira_comments: false          # off: replies go to the ticket's outbox only
      jira_transitions: false
    notification:
      slack_channel: null           # set with slack_webhook_env to allow `notify slack --send`
    archiving:
      stale_after_days: 30
  rules:
    - if:
        trigger: product-prs
      then:
        publishing:
          auto_create_pr: true
