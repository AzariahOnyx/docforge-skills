# Fictional demo pack for tests. Real house packs live in a private repository.
schema_version: 1
name: demo
version: 0.1.0
description: House style for the fictional Pulseboard product.
conventions: conventions.md
products:
  - key: alerts
    title: Pulseboard Alerts
  - key: boards
    title: Pulseboard Boards
references:
  - path: references/products/alerts.md
    title: Alerts product reference
    stages: [analyzer, drafter, proofreader]
    products: [alerts]
  - path: references/products/boards.md
    title: Boards product reference
    stages: [analyzer, drafter, proofreader]
    products: [boards]
  - path: references/voice.md
    title: Pulseboard voice
  - path: references/product-terms.md
    title: Pulseboard product terms
    stages: [analyzer, drafter, proofreader]
  - path: references/how-to-extras.md
    title: Extra rules for how-to articles
    applies_to: [how-to/]
article_specs:
  - type: procedural
    title: Step-by-step article
    path: specs/how-to.md
    applies_to: [how-to/]
  - type: overview
    title: Feature overview
    path: specs/feature-guide.md
    applies_to: [feature/]
  - type: faq
    path: specs/faq.md
cleanup_steps:                    # fictional house rules, run in this order
  - id: em-dashes
    kind: replace
    description: Replace em dashes with a spaced hyphen.
    pattern: " *\u2014 *"
    replacement: " - "
  - id: triage-tags
    kind: replace
    description: Remove triage tags the drafter echoed.
    pattern: '\s*\[(?:UPDATE EXISTING|NET-NEW)\]'
    replacement: ""
    ignorecase: true
  - id: feature-flags
    kind: drop_sentences
    description: Remove sentences that name an internal flag (three or more snake_case parts).
    pattern: '\b[a-z][a-z0-9]*(?:_[a-z][a-z0-9]+){2,}\b'
  - id: support-links
    kind: marker_link
    description: Turn support markers into pre-filled support email links.
    path: cleanup/README.md
    pattern: '\[\s*SUPPORT\s+(?P<type>INQUIRY|ENABLE)\s*(?::(?P<phrase>[^\]]*))?\]'
    address: support@pulseboard.example
    templates:
      INQUIRY: {subject: "Question about {phrase}", line: "I have a question about {phrase}."}
      ENABLE: {subject: "Enable {phrase}", line: "Please enable {phrase} for my workspace."}
    default_type: INQUIRY
    body: "Hello Pulseboard Support,\n\n{line}\n\nThanks,\n"
  - id: merge-notes
    kind: merge_alerts
    description: Merge notes that follow each other into one note with a list.
    types: [NOTE]
  - id: preview-first
    kind: move_to_top
    description: Put the Preview callout first, except in release notes.
    skip: [release-note/]
    match: '^> \*\*Preview\*\*'
  - id: no-raw-html
    kind: check
    description: Report raw HTML other than details and summary.
    pattern: '<(?!/?(?:details|summary)\b)[A-Za-z/][^>]*>'
    message: raw HTML is not allowed outside details
vale:
  styles_path: styles
  based_on: [DemoPack]
capture_profiles:
  - name: demo-app
    path: capture/profiles.yml
flow_profile:                     # fictional exporter: "Step 3/7" or a bare "3/7", plus a footer
  header: '^(?:Step\s+)?(\d+)\s*/\s*(\d+)$'
  noise:
    - '^\d+\s*/\s*\d+$'           # page numbers after the header
    - '^Powered by'
    - '^Next$'
placement:                        # where drafts go in the docs repo
  - applies_to: [feature/, how-to/]
    path: site/{product}/{category}/{slug}.md
  - applies_to: [release-note/]
    path: site/release-notes/{month}/{slug}.md
