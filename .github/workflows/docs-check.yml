name: Documentation structure
# V2.1 branch validates structural and editorial artifacts.

on:
  pull_request:
  push:
    branches: [main, build-reusable-doc-workflow, system-v2-hardening]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check every generated documentation set
        run: |
          for directory in output/*; do
            if [ -d "$directory" ]; then
              python3 scripts/check_outputs.py "$directory"
            fi
          done
      - name: Verify coverage gate rejects broken outputs
        run: python3 scripts/test_checker.py
