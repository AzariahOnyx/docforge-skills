name: Documentation structure

on:
  pull_request:
  push:
    branches: [main, build-reusable-doc-workflow]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check every generated documentation set
        run: |
          for directory in output/*; do
            if [ -d "$directory" ]; then
              python3 scripts/check_outputs.py "$directory"
            fi
          done
      - name: Verify coverage gate rejects broken outputs
        run: python3 scripts/test_checker.py
      - name: Test custom profile validation and source provenance
        run: python3 scripts/test_validate_run.py
      - name: Test Markdown writing and accessibility lint rules
        run: python3 scripts/test_lint_docs.py
      - name: Compile Python scripts
        run: python3 -m compileall -q scripts src/docforge/evidence
      - name: Check README avoids em dashes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text = Path('README.md').read_text(encoding='utf-8')
          assert '\u2014' not in text, 'README must not contain em dashes'
          PY

  engine-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.8"
      - name: Install the engine and its dependencies
        run: uv sync --locked
      - name: Install Vale (pinned, checksum-verified)
        env:
          VALE_VERSION: "3.27.0"
          VALE_SHA256: "c80d62f6bce87b81843ac5b512a26e63213927b957adba0a64fc594570da2000"
        run: |
          archive="vale_${VALE_VERSION}_Linux_64-bit.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$archive" "https://github.com/errata-ai/vale/releases/download/v${VALE_VERSION}/${archive}"
          echo "${VALE_SHA256}  $RUNNER_TEMP/$archive" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/vale"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/vale" vale
          echo "DOCFORGE_VALE=$RUNNER_TEMP/vale/vale" >> "$GITHUB_ENV"
      - name: Run engine tests
        run: uv run pytest
